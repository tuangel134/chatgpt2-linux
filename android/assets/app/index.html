<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src http://127.0.0.1:8899">
<title>ChatGPT 2</title>
<style>
:root{--bg:#171717;--side:#0f0f0f;--surface:#212121;--surface2:#2f2f2f;--line:#303030;--text:#ececec;--muted:#9b9b9b;--accent:#10a37f;--red:#ef4444;--amber:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
/* barra superior */
#top{display:flex;align-items:center;gap:8px;padding:8px 10px;flex:0 0 auto}
.icon{width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:0 0 auto}
.icon svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#modelPill{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:2px 8px}
#modelPill b{font-weight:600;font-size:17px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#modelPill b::after{content:" ▾";color:var(--muted);font-size:13px}
#modelPill small{color:var(--muted);font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#conn{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
#conn.ok{background:var(--accent)}#conn.bad{background:var(--amber)}
/* mensajes */
#msgs{flex:1 1 auto;overflow-y:auto;padding:6px 14px 14px;scroll-behavior:smooth}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--muted);padding:0 24px}
.empty h2{margin:0;color:var(--text);font-size:26px;font-weight:600}
.empty .logo{width:54px;height:54px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:26px;color:#fff;margin-bottom:10px}
.u{display:flex;justify-content:flex-end;margin:14px 0 6px}
.u .ub{max-width:100%;background:var(--surface2);padding:9px 14px;border-radius:20px;white-space:pre-wrap;word-break:break-word}
.u .uwrap{max-width:84%}
.u .ub.clip{opacity:.85}
.a{margin:10px 0 6px;word-break:break-word}
.a p,.u p{margin:0 0 10px}.a p:last-child{margin-bottom:0}
.a h1,.a h2,.a h3{font-size:1.05em;margin:14px 0 6px}
.a ul,.a ol{margin:4px 0 10px;padding-left:22px}.a li{margin:2px 0}
.a blockquote{margin:6px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--muted)}
.a a{color:#7cc4ff}
.a code{background:#2b2b2b;border-radius:6px;padding:1px 5px;font:13.5px/1.4 ui-monospace,Menlo,Consolas,monospace}
.a pre{background:#0d0d0d;border:1px solid var(--line);border-radius:12px;margin:8px 0 12px;overflow:hidden}
.a pre .bar{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#1d1d1d;color:var(--muted);font-size:12px}
.a pre code{display:block;background:none;padding:10px 12px;overflow-x:auto;white-space:pre;font-size:13px}
.tools{margin:6px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
.tools summary{list-style:none;padding:8px 12px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px}
.tools summary::-webkit-details-marker{display:none}
.tools summary::after{content:"▾";margin-left:auto}
.tools[open] summary::after{content:"▴"}
.tools .t{padding:6px 12px;border-top:1px solid var(--line);font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;display:flex;gap:8px}
.tools .t i{font-style:normal;flex:0 0 auto}
.tools .t.err{color:#fca5a5}
.live{margin:6px 0}.live .t{color:var(--muted);font:12.5px/1.4 ui-monospace,monospace;margin:3px 0;word-break:break-all}
.dots{display:inline-flex;gap:4px;padding:6px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.1s infinite ease-in-out}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
.err-line{color:#fca5a5;margin:8px 0}
.hb{margin:6px 0 2px}.hb .pill{display:inline-block}
/* compositor */
#comp{flex:0 0 auto;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
#box{background:var(--surface);border-radius:26px;padding:8px 8px 8px 16px;display:flex;align-items:flex-end;gap:8px}
#txt{flex:1 1 auto;background:none;border:0;outline:0;color:var(--text);font:inherit;resize:none;max-height:140px;padding:8px 0;min-height:24px}
#txt::placeholder{color:var(--muted)}
#send{width:40px;height:40px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
#send:disabled{background:var(--surface2);opacity:.6}
#send svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#send.stop{background:#fff}#send.stop svg{stroke:#000;fill:#000}
/* adjuntos */
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 4px 8px}#chips:empty{display:none}
.fchip{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:14px;padding:6px 10px 6px 6px;flex:0 0 auto;max-width:220px;font-size:13px}
.fchip img{width:38px;height:38px;border-radius:9px;object-fit:cover}.fchip .ic{width:38px;height:38px;border-radius:9px;background:var(--surface2);display:grid;place-items:center}
.fchip .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fchip small{display:block;color:var(--muted)}
.fchip button{color:var(--muted);font-size:18px;padding:0 4px}
#attach{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:0 0 auto}
#attach svg{width:20px;height:20px;stroke:var(--text);fill:none;stroke-width:2.2;stroke-linecap:round}
.att{display:block;margin:8px 0;border-radius:14px;overflow:hidden;background:var(--surface);min-height:56px;max-width:min(100%,380px);color:var(--muted);font-size:13px;padding:14px}
.att img{display:block;width:100%;height:auto;border-radius:12px}.att.ld{padding:14px}
.filebtn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin:4px 6px 4px 0;font-size:14px;max-width:100%}
.filebtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u .files{display:flex;flex-direction:column;gap:6px;align-items:flex-end;margin-bottom:4px}
.u .files .att{max-width:220px;margin:0}
.uwrap{display:flex;flex-direction:column;align-items:flex-end}
/* automatizaciones */
#autos{position:fixed;inset:0;background:var(--bg);z-index:35;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#autos.on{display:flex}
#ah{display:flex;align-items:center;gap:8px;padding:8px 10px}#ah b{flex:1;font-size:19px}
#alist{flex:1;overflow-y:auto;padding:4px 14px calc(18px + env(safe-area-inset-bottom))}
.acard{background:var(--surface);border-radius:18px;padding:14px 16px;margin:10px 0}
.acard h4{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px}.acard h4 span.n{flex:1;min-width:0}
.pill{font-size:12px;padding:2px 10px;border-radius:12px;background:#173b30;color:#6ee7b7;flex:0 0 auto}.pill.off{background:#3b2e12;color:#fcd34d}
.acard .sch{color:var(--muted);font-size:14px}
.acard .nx{margin:10px 0 4px;font-size:15px}.acard .nx b{font-size:20px;font-weight:700;color:var(--text)}
.acard .meta{color:var(--muted);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.acard .meta span{background:var(--surface2);border-radius:10px;padding:2px 9px}
.acard button.go{margin-top:10px;background:var(--surface2);border-radius:12px;padding:8px 14px;font-size:14px}
.asum{color:var(--muted);font-size:14px;padding:2px 4px 6px}
/* menú lateral */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;bottom:0;left:0;width:84%;max-width:360px;background:var(--side);transform:translateX(-102%);transition:transform .22s;z-index:21;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#drawer.on{transform:none}
#dh{display:flex;align-items:center;gap:8px;padding:14px 14px 8px}
#dh b{font-size:20px;flex:1}
#search{margin:4px 14px 8px;background:var(--surface);border:0;border-radius:14px;padding:10px 14px;color:var(--text);font:inherit;outline:0}
#newchat{margin:2px 14px 10px;background:var(--text);color:#000;border-radius:24px;padding:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
#dscroll{flex:1;overflow-y:auto;padding:0 8px calc(14px + env(safe-area-inset-bottom))}
.sec{padding:14px 10px 6px;color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.2px}
.proj{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;width:100%;text-align:left}
.proj:active,.chat:active{background:var(--surface)}
.proj .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .c{color:var(--muted);font-size:13px}
.proj svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8}
.chat{display:flex;align-items:center;gap:8px;padding:10px 10px 10px 14px;border-radius:12px;width:100%;text-align:left}
.chat.sub{padding-left:40px}
.chat .n{flex:1;min-width:0}
.chat .n div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .n small{display:block;color:var(--muted);font-size:12px}
.chat.on{background:var(--surface)}
.run{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:b 1.1s infinite}
.dfoot{display:flex;gap:8px;padding:8px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.dfoot button{flex:1;background:var(--surface);border-radius:14px;padding:10px;font-size:14px}
/* hojas */
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-radius:22px 22px 0 0;z-index:31;transform:translateY(105%);transition:transform .22s;max-height:78%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
#sheet.on{transform:none}
#sheet h3{margin:0;padding:16px 18px 6px;font-size:17px}
#sheetBody{overflow-y:auto;padding:4px 10px 12px}
.opt{display:flex;align-items:center;gap:10px;padding:12px 10px;border-radius:12px;width:100%;text-align:left}
.opt:active{background:var(--surface2)}
.opt .n{flex:1;min-width:0}.opt .n small{display:block;color:var(--muted);font-size:12px}
.opt .ck{color:var(--accent);font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap;padding:6px 10px 10px}
.chip{padding:7px 14px;border-radius:18px;background:var(--surface2);font-size:14px}.chip.on{background:var(--accent);color:#fff}
#shot{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#shot.on{display:flex}#shot img{flex:1;min-height:0;object-fit:contain;width:100%}
#shot button{padding:16px;background:var(--surface);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#3a1d1d;color:#fecaca;padding:10px 16px;border-radius:14px;max-width:88%;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
#toast.on{opacity:1;transform:translateX(-50%)}#toast.info{background:#173b30;color:#bbf7d0}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="icon" id="menuBtn" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 8h16M4 16h10"/></svg></button>
    <button id="modelPill"><b id="modelName">Modelo</b><small id="modelSub"></small></button>
    <span id="conn"></span>
    <button class="icon" id="moreBtn" aria-label="Más"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg></button>
  </div>
  <div id="msgs"></div>
  <div id="comp"><div id="chips"></div><div id="box">
    <button id="attach" aria-label="Adjuntar"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <textarea id="txt" rows="1" placeholder="Pregunta lo que quieras"></textarea>
    <button id="send" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  </div></div>
</div>
<div id="scrim"></div>
<aside id="drawer">
  <div id="dh"><b>ChatGPT 2</b><button class="icon" id="closeDrawer" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <input id="search" placeholder="Buscar conversaciones" autocomplete="off">
  <button id="newchat"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuevo chat</button>
  <button class="proj" id="autosBtn" style="margin:0 6px"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="n">Automatizaciones</span><span class="c" id="autosCount"></span></button>
  <div id="dscroll"></div>
  <div class="dfoot"><button id="refreshBtn">Actualizar</button><button id="shotBtn">Captura del escritorio</button></div>
</aside>
<div id="sheet"><h3 id="sheetTitle"></h3><div id="sheetBody"></div></div>
<div id="shot"><img id="shotImg" alt="Captura"><button id="shotSave">Guardar en el teléfono</button><button id="shotClose">Cerrar</button></div>
<div id="autos"><div id="ah"><button class="icon" id="autosBack" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><b>Automatizaciones</b><button class="icon" id="autosRefresh" aria-label="Actualizar"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg></button></div><div id="alist"></div></div>
<input type="file" id="pickImg" accept="image/*" multiple hidden><input type="file" id="pickFile" multiple hidden>
<div id="toast"></div>
<script>
"use strict";
// ---------------------------------------------------------------- puente nativo (Android) o de desarrollo
const DEV = new URLSearchParams(location.search).get("dev");
const pending = new Map(); let rid = 0;
window.__native = (id, ok, data) => { const p = pending.get(id); if (!p) return; pending.delete(id); clearTimeout(p.t); if (ok) { try { p.res(JSON.parse(data)); } catch (e) { p.rej(new Error("Respuesta ilegible")); } } else p.rej(new Error(data || "Error")); };
function call(cmd, timeout = 70000) {
  return new Promise((res, rej) => {
    const id = String(++rid);
    const t = setTimeout(() => { pending.delete(id); rej(new Error("Sin respuesta de la PC")); }, timeout);
    pending.set(id, { res, rej, t });
    if (window.Android) window.Android.call(id, JSON.stringify(cmd));
    else if (DEV) fetch(DEV + "/call", { method: "POST", body: JSON.stringify(cmd) }).then((r) => r.json()).then((j) => window.__native(id, j.ok !== false, j.ok === false ? j.error : JSON.stringify(j))).catch((e) => window.__native(id, false, e.message));
    else window.__native(id, false, "Sin puente");
  });
}
const $ = (s) => document.querySelector(s);
const store = { get: (k, d) => { try { const v = localStorage.getItem("c2." + k); return v === null ? d : JSON.parse(v); } catch { return d; } }, set: (k, v) => { try { localStorage.setItem("c2." + k, JSON.stringify(v)); } catch {} } };

// ---------------------------------------------------------------- estado
const S = { ws: [], wsId: store.get("wsId", ""), sid: store.get("sid", ""), msgs: [], models: [], defModel: "", model: store.get("model", ""), effort: store.get("effort", ""), job: null, loading: false, err: "", openProj: store.get("openProj", {}) };
const IMG_RE = /\.(png|jpe?g|gif|webp|bmp)$/i;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const curWs = () => S.ws.find((w) => w.id === S.wsId);
const curSession = () => { const w = curWs(); return w && w.sessions.find((x) => x.id === S.sid); };
function toast(t, info) { const e = $("#toast"); e.textContent = t; e.className = "on" + (info ? " info" : ""); clearTimeout(toast.t); toast.t = setTimeout(() => (e.className = ""), 3800); }
function setConn(state) { $("#conn").className = state; }

// ---------------------------------------------------------------- markdown seguro (todo se escapa antes de dar formato)
function md(src) {
  const blocks = []; let t = String(src).replace(/\r/g, "").replace(/&amp;/g, "&");
  t = t.replace(/```([\w+#.-]*)\n([\s\S]*?)```/g, (_, lang, code) => { blocks.push({ lang, code: code.replace(/\n$/, "") }); return `\u0000${blocks.length - 1}\u0000`; });
  const inline = (s) => esc(s)
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/!\[([^\]\n]*)\]\((\/[^)\n]+)\)/g, (_, alt, p) => `<span class="att ld" data-img="${p}">🖼 ${alt || "imagen"}</span>`)
    .replace(/!\[([^\]\n]*)\]\([^)\n]*\)/g, "<em>🖼 $1</em>")
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" rel="noopener">$1</a>')
    .replace(/\[([^\]\n]+)\]\((\/[^)\n#]+)(?:#[^)\n]*)?\)/g, (_, t, p) => IMG_RE.test(p) ? `<span class="att ld" data-img="${p}">🖼 ${t}</span>` : `<button class="filebtn" data-file="${p}" data-name="${t}">📎 <span>${t}</span></button>`)
    .replace(/\[([^\]\n]+)\]\((?!https?:)[^)\n]*\)/g, "<code>$1</code>")
    .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" rel="noopener">$2</a>');
  const out = []; const lines = t.split("\n"); let list = null, para = [];
  const flushP = () => { if (para.length) { out.push("<p>" + inline(para.join("\n")).replace(/\n/g, "<br>") + "</p>"); para = []; } };
  const flushL = () => { if (list) { out.push(`<${list.t}>${list.items.map((i) => "<li>" + inline(i) + "</li>").join("")}</${list.t}>`); list = null; } };
  for (const line of lines) {
    let m;
    if ((m = /^\u0000(\d+)\u0000$/.exec(line.trim()))) { flushP(); flushL(); const b = blocks[+m[1]]; out.push(`<pre><div class="bar"><span>${esc(b.lang || "código")}</span><button data-copy="${+m[1]}">Copiar</button></div><code>${esc(b.code)}</code></pre>`); }
    else if ((m = /^(#{1,3})\s+(.*)$/.exec(line))) { flushP(); flushL(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = /^\s*[-*•]\s+(.*)$/.exec(line))) { flushP(); if (!list || list.t !== "ul") { flushL(); list = { t: "ul", items: [] }; } list.items.push(m[1]); }
    else if ((m = /^\s*\d+[.)]\s+(.*)$/.exec(line))) { flushP(); if (!list || list.t !== "ol") { flushL(); list = { t: "ol", items: [] }; } list.items.push(m[1]); }
    else if ((m = /^>\s?(.*)$/.exec(line))) { flushP(); flushL(); out.push("<blockquote>" + inline(m[1]) + "</blockquote>"); }
    else if (!line.trim()) { flushP(); flushL(); }
    else { flushL(); para.push(line); }
  }
  flushP(); flushL();
  md.blocks = blocks; return out.join("");
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-copy]"); if (!b) return; const code = b.closest("pre").querySelector("code").textContent; (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => (b.textContent = "Copiado"), () => { const r = document.createRange(); r.selectNodeContents(b.closest("pre").querySelector("code")); getSelection().removeAllRanges(); getSelection().addRange(r); b.textContent = "Selecciona y copia"; }); setTimeout(() => (b.textContent = "Copiar"), 1800); });

// ---------------------------------------------------------------- pintado del chat
const DECISION = { DONT_NOTIFY: "sin aviso", NOTIFY: "con aviso" };
function assistantHtml(text) {
  const m = /<heartbeat>([\s\S]*?)<\/heartbeat>/.exec(text);
  if (!m) return md(text) + bareImages(text);
  const tag = (n) => { const x = new RegExp("<" + n + ">([\\s\\S]*?)</" + n + ">").exec(m[1]); return x ? x[1].trim() : ""; };
  const id = tag("automation_id"), dec = tag("decision"), msg = tag("message");
  const rest = text.replace(m[0], "").trim();
  return `<div class="hb"><span class="pill">⏱ Automatización${id ? " · " + esc(id) : ""}${dec ? " · " + esc(DECISION[dec] || dec) : ""}</span></div>${md(msg || m[1])}${rest ? md(rest) : ""}${bareImages(msg + " " + rest)}`;
}

// ---------------------------------------------------------------- adjuntos (se comprimen las fotos y se suben por trozos cifrados)
const pendingFiles = [];  // {name, blob, mime, image, url, state:'listo'|'subiendo'|'error', id}
const fmtSize = (n) => (n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB");
async function prepare(file) {
  let blob = file, name = file.name || "archivo", mime = file.type || "application/octet-stream";
  if (/^image\/(jpeg|png|webp|heic|heif)/.test(mime) && !/gif/.test(mime)) {
    try {
      const bmp = await createImageBitmap(file); const k = Math.min(1, 2048 / Math.max(bmp.width, bmp.height));
      if (k < 1 || file.size > 1500000) {
        const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
        const out = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.86));
        if (out && out.size < file.size) { blob = out; mime = "image/jpeg"; name = name.replace(/\.[^.]+$/, "") + ".jpg"; }
      }
    } catch (e) { /* si no se puede decodificar (HEIC...), se manda tal cual */ }
  }
  return { name, blob, mime, image: mime.startsWith("image/"), url: mime.startsWith("image/") ? URL.createObjectURL(blob) : "", state: "listo", id: "" };
}
async function addFiles(list) {
  for (const f of Array.from(list || [])) {
    if (pendingFiles.length >= 8) { toast("Máximo 8 archivos por mensaje"); break; }
    if (f.size > 40 * 1048576) { toast(f.name + " supera los 40 MB"); continue; }
    pendingFiles.push(await prepare(f));
  }
  paintChips();
}
function paintChips() {
  $("#chips").innerHTML = pendingFiles.map((f, i) => `<div class="fchip">${f.image ? `<img src="${f.url}" alt="">` : '<span class="ic">📎</span>'}<span class="t">${esc(f.name)}<small>${f.state === "subiendo" ? "Subiendo…" : f.state === "error" ? "Falló" : fmtSize(f.blob.size)}</small></span><button data-rm="${i}" aria-label="Quitar">✕</button></div>`).join("");
  paintSend();
}

$("#attach").addEventListener("click", () => sheet("Adjuntar", '<button class="opt" data-k="img">🖼&nbsp; Foto o imagen de la galería</button><button class="opt" data-k="file">📎&nbsp; Archivo (PDF, texto, zip…)</button>', (b) => b.addEventListener("click", (e) => { const o = e.target.closest("[data-k]"); if (!o) return; closeSheet(); setTimeout(() => $(o.dataset.k === "img" ? "#pickImg" : "#pickFile").click(), 150); })));
for (const id of ["#pickImg", "#pickFile"]) $(id).addEventListener("change", (e) => { addFiles(e.target.files); e.target.value = ""; });
async function uploadOne(f) {
  const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/-/g, "").slice(0, 32);
  const size = f.blob.size, CH = 700000, total = Math.max(1, Math.ceil(size / CH));
  for (let i = 0; i < total; i++) {
    const part = f.blob.slice(i * CH, (i + 1) * CH);
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = () => rej(new Error("No se pudo leer el archivo")); r.readAsDataURL(part); });
    await call({ type: "upload", uploadId: id, name: f.name, index: i, total, data }, 70000);
  }

// ---------------------------------------------------------------- enviar / seguir tarea
async function send() {
  const text = $("#txt").value.trim(); const files = pendingFiles.slice();
  if (S.job && S.job.running) { try { await call({ type: "cancel", workspaceId: S.wsId, sessionId: S.sid }, 30000); toast("Cancelando…", true); } catch (e) { toast(e.message); } return; }
  if (!text && !files.length) return;
  if (!S.wsId) { toast("Elige primero un proyecto en el menú"); return; }
  $("#txt").value = ""; autosize(); S.err = "";
  S.msgs.push({ role: "user", message: { parts: [{ type: "text", text }] }, files: files.map((f) => ({ path: "", name: f.name, image: f.image, local: f.url })) });
  S.job = { running: true, partial: "", activity: [], uploading: files.length > 0 }; renderMsgs(true); paintSend();
  try {
    const attachments = [];
    for (const f of files) { f.state = "subiendo"; paintChips(); try { attachments.push({ id: await uploadOne(f) }); } catch (e) { f.state = "error"; paintChips(); throw new Error("No se pudo subir " + f.name + ": " + e.message); } }
    pendingFiles.length = 0; paintChips();
    const cmd = { type: "send", workspaceId: S.wsId, sessionId: S.sid || undefined, text, ...(attachments.length ? { attachments } : {}), ...(S.model ? { model: S.model } : {}), ...(S.effort ? { effort: S.effort } : {}) };
    S.lastCmd = cmd; S.busyRetry = null;
    const r = await call(cmd, 60000);
    S.sid = r.sessionId; store.set("sid", S.sid); S.job.id = r.jobId; paintTop(); follow(r.jobId, S.sid);
  } catch (e) { S.job = null; S.err = e.message; if (/continuar en una copia/i.test(e.message) && S.lastCmd) S.busyRetry = S.lastCmd; renderMsgs(true); paintSend(); }
}
async function forkAndSend() {
  const cmd = S.busyRetry; if (!cmd) return; S.busyRetry = null; S.err = ""; S.job = { running: true, partial: "", activity: [] }; renderMsgs(true); paintSend();
  try { const r = await call({ ...cmd, fork: true }, 60000); S.sid = r.sessionId; store.set("sid", S.sid); S.job.id = r.jobId; paintTop(); refreshStatus(); follow(r.jobId, S.sid); }
  catch (e) { S.job = null; S.err = e.message; renderMsgs(true); paintSend(); }
}
document.addEventListener("click", (e) => { if (e.target.closest("[data-fork]")) forkAndSend(); });
async function follow(jobId, sid) {
  let misses = 0;
  while (S.job && S.job.running && S.job.id === jobId) {
    await new Promise((r) => setTimeout(r, 1200));
    if (S.sid !== sid) return;
    try {
      const r = await call({ type: "job", jobId }, 40000); misses = 0; const st = r.status;
      if (S.job && S.job.id === jobId) { S.job.partial = st.partial || ""; S.job.activity = st.activity || []; }
      if (st.status !== "running") {
        S.job = null; if (st.status === "error") S.err = st.error || "La tarea falló."; else if (st.status === "cancelled") S.err = "Tarea cancelada.";
        await loadMessages(true); paintSend(); refreshStatus(); return;
      }
      renderMsgs(false);
    } catch (e) { if (++misses >= 4) { S.job = null; S.err = "Se perdió la conexión con la PC: " + e.message; renderMsgs(true); paintSend(); return; } }
  }
}
const autosize = () => { const t = $("#txt"); t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; paintSend(); };
$("#txt").addEventListener("input", autosize);
$("#send").addEventListener("click", send);

// ---------------------------------------------------------------- automatizaciones
const AU = { list: [], skew: 0 };
function dur(ms) { const s = Math.max(0, Math.round(ms / 1000)), d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60); return d ? `${d} d ${h} h` : h ? `${h} h ${m} min` : m ? `${m} min` : "menos de 1 min"; }
function pcNow() { return Date.now() + AU.skew; }
function whenText(t) {
  const d = new Date(t), now = new Date(pcNow()), tom = new Date(pcNow() + 86400000), same = (a, b) => a.toDateString() === b.toDateString();
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return same(d, now) ? `hoy a las ${hm}` : same(d, tom) ? `mañana a las ${hm}` : d.toLocaleDateString([], { weekday: "long", day: "numeric", month: "short" }) + ` a las ${hm}`;
}
function paintAutos() {
  const el = $("#alist"); const act = AU.list.filter((a) => a.status === "ACTIVE");
  const next = act.filter((a) => a.nextRunAt).sort((a, b) => a.nextRunAt - b.nextRunAt)[0];
  $("#autosCount").textContent = AU.list.length ? (next ? "en " + dur(next.nextRunAt - pcNow()) : String(AU.list.length)) : "";
  if (!$("#autos").classList.contains("on")) return;
  if (!AU.list.length) { el.innerHTML = '<div class="empty" style="height:60%"><h2>Sin automatizaciones</h2><span>Las que crees en ChatGPT 2 aparecen aquí con el tiempo que les queda.</span></div>'; return; }
  let h = `<div class="asum">${act.length} activa${act.length === 1 ? "" : "s"} de ${AU.list.length}${next ? " · la próxima en " + dur(next.nextRunAt - pcNow()) : ""}</div>`;
  for (const a of AU.list) {
    const on = a.status === "ACTIVE", left = a.nextRunAt ? a.nextRunAt - pcNow() : null;
    h += `<div class="acard"><h4><span class="n">${esc(a.name)}</span><span class="pill${on ? "" : " off"}">${on ? "Activa" : a.status === "PAUSED" ? "En pausa" : esc(a.status)}</span></h4><div class="sch">${esc(a.schedule)}</div>`;
    if (!on) h += '<div class="nx">En pausa: no se ejecutará hasta reanudarla.</div>';
    else if (left === null) h += '<div class="nx">Sin próxima ejecución programada.</div>';
    else if (left <= 0) h += '<div class="nx"><b>Ahora</b> · toca ejecutarse o ya está en marcha</div>';
    else h += `<div class="nx">Le quedan <b>${dur(left)}</b></div><div class="sch">Próxima: ${whenText(a.nextRunAt)}</div>`;
    h += `<div class="meta">${a.lastRunAt ? `<span>Última: hace ${dur(pcNow() - a.lastRunAt)}</span>` : "<span>Aún sin ejecutar</span>"}${a.model ? `<span>${esc(a.model)}</span>` : ""}${a.effort ? `<span>razonamiento ${esc(a.effort)}</span>` : ""}</div>`;
    if (a.threadId) h += `<button class="go" data-th="${esc(a.threadId)}">Abrir su conversación</button>`;
    h += "</div>";
  }
  el.innerHTML = h;
}
async function loadAutos(show) {
  try { const r = await call({ type: "automations" }, 40000); AU.list = r.automations || []; AU.skew = (r.now || Date.now()) - Date.now(); paintAutos(); }
  catch (e) { if (show) toast("No se pudieron leer las automatizaciones: " + e.message); }
}
function openAutos() { drawer(false); $("#autos").classList.add("on"); paintAutos(); loadAutos(true); }
$("#autosBtn").addEventListener("click", openAutos);
$("#autosBack").addEventListener("click", () => $("#autos").classList.remove("on"));
$("#autosRefresh").addEventListener("click", () => { toast("Actualizando…", true); loadAutos(true); });
$("#alist").addEventListener("click", (e) => {
  const b = e.target.closest("[data-th]"); if (!b) return; const w = S.ws.find((x) => x.sessions.some((s) => s.id === b.dataset.th));
  if (!w) { toast("No encuentro esa conversación en tus proyectos"); return; }
  $("#autos").classList.remove("on"); openSession(w.id, b.dataset.th);
});
setInterval(() => { if ($("#autos").classList.contains("on")) paintAutos(); }, 20000);

// ---------------------------------------------------------------- arranque
(async function init() {
  paintSend(); renderMsgs(true); setConn("");
  const ok = await refreshStatus();
  if (!ok) { S.err = "No se pudo hablar con la PC. Comprueba que ChatGPT 2 sigue encendido y con el control remoto activo."; renderMsgs(true); return; }
  loadModels().catch(() => {}); loadAutos(false);
  const w = curWs();
  if (w && S.sid && w.sessions.some((s) => s.id === S.sid)) await openSession(S.wsId, S.sid);
  else if (w && w.sessions[0]) await openSession(w.id, w.sessions[0].id);
  else { S.sid = ""; renderMsgs(true); }
  paintTop();
})();
</script>
</body>
